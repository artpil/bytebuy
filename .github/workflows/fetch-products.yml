name: Update AliExpress Products

on:
  schedule:
    # Запуск каждый день в 00:00 UTC
    - cron: '0 0 * * *'
  # Кнопка для ручного запуска во вкладке Actions
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch AliExpress Products from Admitad API
        env:
          BASE64_HEADER: ${{ secrets.ADMITAD_BASE64_HEADER }}
          CLIENT_ID: ${{ secrets.ADMITAD_CLIENT_ID }}
          WEBSITE_ID: ${{ secrets.ADMITAD_WEBSITE_ID }}
        run: |
          # 1. Получаем access_token, используя ваш base64_header
          TOKEN_RESPONSE=$(curl -s -X POST https://api.admitad.com/token/ \
            -H "Authorization: Basic ${BASE64_HEADER}" \
            -d "grant_type=client_credentials&client_id=${CLIENT_ID}&scope=adv_products_website")
          
          ACCESS_TOKEN=$(echo $TOKEN_RESPONSE | jq -r '.access_token')

          # Проверка на случай ошибки авторизации
          if [ "$ACCESS_TOKEN" == "null" ] || [ -z "$ACCESS_TOKEN" ]; then
            echo "Ошибка авторизации Admitad API:"
            echo $TOKEN_RESPONSE
            exit 1
          fi

          # 2. Создаем директорию public (если еще нет) и запрашиваем товары
          mkdir -p public
          
          curl -s -X GET "https://api.admitad.com/ali_express/reward_list/?website=${WEBSITE_ID}&limit=50" \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -o public/products.json

      - name: Commit and Push updated products.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add public/products.json
          git commit -m "chore: auto-update aliexpress products [skip ci]" || exit 0
          git push