name: Update AliExpress Products

on:
  schedule:
    # Запуск каждый день в 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch AliExpress Products from Admitad API
        env:
          ADMITAD_CLIENT_ID: ${{ secrets.ADMITAD_CLIENT_ID }}
          ADMITAD_CLIENT_SECRET: ${{ secrets.ADMITAD_CLIENT_SECRET }}
          ADMITAD_WEBSITE_ID: ${{ secrets.ADMITAD_WEBSITE_ID }}
        run: |
          # 1. Получаем access_token с необходимыми scope
          TOKEN_RESPONSE=$(curl -s -X POST https://api.admitad.com/token/ \
            -H "Content-Type: application/x-www-form-urlencoded" \
            -d "grant_type=client_credentials" \
            -d "client_id=${ADMITAD_CLIENT_ID}" \
            -d "client_secret=${ADMITAD_CLIENT_SECRET}" \
            -d "scope=aliexpress_commission")

          ACCESS_TOKEN=$(echo $TOKEN_RESPONSE | jq -r '.access_token // empty')

          if [ -z "$ACCESS_TOKEN" ]; then
            echo "❌ Ошибка авторизации Admitad API!"
            echo "Ответ сервера: $TOKEN_RESPONSE"
            exit 1
          fi

          echo "✅ Токен успешно получен"

          # 2. Создаем папку public и запрашиваем товары
          mkdir -p public

          # Используем правильный endpoint для получения товаров
          HTTP_STATUS=$(curl -s -o public/products.json -w "%{http_code}" \
            -X GET "https://api.admitad.com/aliexpress/products/?website_id=${ADMITAD_WEBSITE_ID}&limit=100" \
            -H "Authorization: Bearer ${ACCESS_TOKEN}")

          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "❌ Ошибка при запросе товаров! HTTP Status: $HTTP_STATUS"
            echo "Ответ API:"
            cat public/products.json
            exit 1
          fi

          echo "✅ Товары успешно сохранены в public/products.json"

      - name: Commit and Push updated products.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add public/products.json
          git commit -m "chore: auto-update aliexpress products [skip ci]" || exit 0
          git push